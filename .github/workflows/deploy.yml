name: Deploy Laravel Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_SERVER_IP }}
          port: ${{ secrets.DEPLOY_SERVER_PORT }}
          username: ${{ secrets.DEPLOY_SERVER_USER }}
          password: ${{ secrets.DEPLOY_SERVER_PASSWORD }}
          script: |
            # Navigate to your domain's public directory
            cd domains/hr-assistance.online/public_html

            # Pull the latest changes from GitHub
            git pull origin main

            # Install PHP dependencies
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # Build frontend assets (Tailwind CSS via Vite)
            npm ci --no-audit --no-fund
            npm run build

            # Run database migrations
            php artisan migrate --force

            # Clear and rebuild caches.
            # NOTE: route:cache is intentionally omitted - this app uses closure
            # routes (/, /test-deepseek, /settings/export, /admin/system, fallback)
            # which cannot be serialized and would fail the deploy.
            php artisan config:cache
            php artisan view:cache
